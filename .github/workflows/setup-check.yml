name: Setup check

on:
  workflow_dispatch:

concurrency:
  group: rankings
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List R2 bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: aws s3 ls "s3://${{ vars.R2_BUCKET }}" --endpoint-url "${{ vars.R2_ENDPOINT }}"

      - name: List B2 bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
        run: |
          # B2 signs requests with the region in its endpoint, e.g. s3.eu-central-003.backblazeb2.com
          export AWS_DEFAULT_REGION=$(echo "$B2_ENDPOINT" | sed -E 's#^https?://s3\.([^.]+)\..*#\1#')
          aws s3 ls "s3://${{ vars.B2_BUCKET }}" --endpoint-url "$B2_ENDPOINT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy placeholder page
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --name "${{ vars.CF_WORKER_NAME }}"
