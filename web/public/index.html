<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R6 Power Ranking</title>
  <meta name="description" content="Daily power rankings of top-level Rainbow Six Siege teams, rated map by map.">
  <link rel="icon" href="logos/fallback.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="#/rankings">R6 Power Ranking</a>
      <nav class="tabs" aria-label="Sections">
        <a href="#/rankings" data-tab="rankings">Rankings</a>
        <a href="#/regions" data-tab="regions">Regions</a>
        <a href="#/movers" data-tab="movers">Movers</a>
      </nav>
    </div>
  </header>
  <main id="view" class="wrap" aria-live="polite">
    <p class="muted">Loading…</p>
  </main>
  <footer class="wrap site-footer">
    <p id="updated" class="muted"></p>
    <p class="muted">Every top-level map counts, rated with a two-layer Elo: region rating plus the team's offset within it. Rankings change once a day.</p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
